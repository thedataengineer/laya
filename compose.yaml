services:
  taut:
    build:
      context: .
      args:
        TORCH_INDEX: "${TAUT_TORCH_INDEX:-cpu}"
    environment:
      TAUT_DEVICE: "${TAUT_DEVICE:-cpu}"
      TAUT_MODEL: "${TAUT_MODEL:-auto}"
      TAUT_MODEL_PATH: "${TAUT_MODEL_PATH:-}"
      TAUT_REQUEST_FILE: "${TAUT_REQUEST_FILE:-/opt/taut/examples/request.json}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_TOKEN_FILE: "${HF_TOKEN_FILE:-}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
    volumes:
      - model-cache:/home/taut/.cache/huggingface
    init: true

volumes:
  model-cache:
    name: "${TAUT_CACHE_VOLUME:-${COMPOSE_PROJECT_NAME}_model-cache}"
