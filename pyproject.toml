[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taut"
version = "0.4.0"
description = "Typed decisions in one forward pass, behind a risk bound you can certify"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Karteek Yadavilli", email = "aswanikarteek@gmail.com" }
]
maintainers = [
    { name = "Karteek Yadavilli", email = "aswanikarteek@gmail.com" }
]
keywords = ["decision-model", "conformal-prediction", "risk-control", "calibration", "selective-prediction", "system-one", "routing", "guardrails", "moderation", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
]

[tool.setuptools]
# assets/, research/ and notebooks/ sit in the root, so auto-discovery bails out.
packages = ["taut", "taut.mcp", "taut.integrations"]

[project.optional-dependencies]
# `pip install taut[serve]` adds the HTTP server (taut.serve / the taut-serve CLI).
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
# `pip install taut[fast]` adds the TileLang GPU fast path (taut/fast.py); everything else works without it.
fast = ["tilelang>=0.1.14"]

# `pip install taut[mcp]` adds the MCP stdio server (taut.mcp / the taut-mcp-server CLI).
mcp = ["mcp>=2.2.0"]

onnx = ["onnx", "onnxruntime"]

# `pip install taut[langchain]` adds the LangChain / LangGraph integrations (taut.integrations).
langchain = [
    "langchain-core>=0.2.0",
]

[project.scripts]
taut = "taut.cli:main"
taut-serve = "taut.serve:main"
taut-mcp-server = "taut.mcp.server:main"

[project.urls]
Homepage = "https://github.com/thedataengineer/taut"
Source = "https://github.com/thedataengineer/taut"
Issues = "https://github.com/thedataengineer/taut/issues"
Checkpoints = "https://huggingface.co/thekarteek/taut"
Upstream = "https://github.com/NandhaKishorM/laya"
