# Serve Taut over HTTP from the same image, so a Jev client can point its `baseUrl` at it:
#
#   docker compose -f compose.yaml -f compose.http.yaml up --build taut-serve
#   curl -s localhost:8000/health
#   curl -s localhost:8000/v1/systemone -H 'content-type: application/json' \
#     --data @examples/docker/request.json
#
# For NVIDIA, append -f compose.cuda.yaml before "up":
#
#   docker compose -f compose.yaml -f compose.http.yaml -f compose.cuda.yaml up --build taut-serve
#
# This file is additive. `taut` in compose.yaml still runs the one-shot SDK quickstart and
# still publishes no ports, so `docker compose run --rm taut` behaves exactly as before.
# Weights share the same named cache volume as that service.
#
# Set TAUT_API_KEY (or TAUT_API_KEY_FILE) to require `Authorization: Bearer <key>`.
# TAUT_PRELOAD=1 builds every checkpoint at startup so the first request does not pay for
# it; the default here is 0 because it makes the container download the whole family on
# first boot, which is a surprise in a quickstart.
services:
  taut-serve:
    build:
      context: .
      args:
        TORCH_INDEX: "${TAUT_TORCH_INDEX:-cpu}"
    # Overrides the image's one-shot quickstart CMD; the ENTRYPOINT that loads *_FILE
    # secrets still runs first.
    command: ["taut-serve"]
    ports:
      # Host port first, container port second. Both come from TAUT_PORT, which
      # `taut-serve` itself reads, so they cannot drift apart.
      - "${TAUT_PORT:-8000}:${TAUT_PORT:-8000}"
    environment:
      TAUT_HOST: "${TAUT_HOST:-0.0.0.0}"
      TAUT_PORT: "${TAUT_PORT:-8000}"
      TAUT_DEVICE: "${TAUT_DEVICE:-cpu}"
      TAUT_PRELOAD: "${TAUT_PRELOAD:-0}"
      TAUT_MODELS: "${TAUT_MODELS:-}"
      TAUT_THREADS: "${TAUT_THREADS:-${OMP_NUM_THREADS:-4}}"
      TAUT_AUTO_TASK: "${TAUT_AUTO_TASK:-0}"
      TAUT_LOG_LEVEL: "${TAUT_LOG_LEVEL:-info}"
      TAUT_API_KEY: "${TAUT_API_KEY:-}"
      TAUT_API_KEY_FILE: "${TAUT_API_KEY_FILE:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_TOKEN_FILE: "${HF_TOKEN_FILE:-}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
    volumes:
      - model-cache:/home/taut/.cache/huggingface
      # Optional token files, readable by UID 10001. Never put a secret value in the
      # environment; these paths are read once at startup and the *_FILE variable is
      # then removed before the server execs.
      # - ${HF_TOKEN_PATH:?Set HF_TOKEN_PATH}:/run/secrets/hf_token:ro
      # - ${TAUT_API_KEY_PATH:?Set TAUT_API_KEY_PATH}:/run/secrets/taut_api_key:ro
    init: true
    restart: unless-stopped

volumes:
  model-cache:
    name: "${TAUT_CACHE_VOLUME:-${COMPOSE_PROJECT_NAME}_model-cache}"
