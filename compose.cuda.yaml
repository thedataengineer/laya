# Use with compose.yaml, and with compose.http.yaml when serving over HTTP. The
# `taut-serve` override repeats the CUDA build args and device reservation, because a
# Compose override replaces a service's `build` block whole rather than merging it, so
# adding this file without repeating them would silently serve on CPU.
services:
  taut:
    build:
      args:
        TORCH_INDEX: "${TAUT_TORCH_INDEX:-cu128}"
    environment:
      TAUT_DEVICE: "${TAUT_DEVICE:-cuda}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TAUT_GPU_ID:-0}"]
              capabilities: [gpu]

  taut-serve:
    build:
      context: .
      args:
        TORCH_INDEX: "${TAUT_TORCH_INDEX:-cu128}"
    environment:
      TAUT_DEVICE: "${TAUT_DEVICE:-cuda}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TAUT_GPU_ID:-0}"]
              capabilities: [gpu]
